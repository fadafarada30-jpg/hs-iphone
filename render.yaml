databases:
  - name: hs-iphone-db
    plan: free
    databaseName: hs_iphone
    user: hs_iphone

services:
  - type: web
    name: hs-iphone
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "HS-iPhone"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: base64:TVwbPazj9WjBFuUSe89XJmX69JfLr7gPcRU6tFMNgPU=
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://hs-iphone-production.up.railway.app
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: hs-iphone-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hs-iphone-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: hs-iphone-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hs-iphone-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hs-iphone-db
          property: password
